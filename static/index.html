<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceAgent — Talk to AI</title>
    <meta name="description" content="Real-time voice conversation with a local AI agent powered by Deepgram and LiveKit.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎙️ VoiceAgent</h1>
            <p>Talk naturally with your local AI assistant.<br>Powered by qwen2.5:3b + Deepgram.</p>
        </div>

        <!-- Status -->
        <div class="status-badge" id="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">Ready to connect</span>
        </div>

        <!-- Voice Orb -->
        <div class="orb-container">
            <div class="orb-ring"></div>
            <div class="orb-ring"></div>
            <div class="orb idle" id="orb"></div>
        </div>

        <!-- Live Transcript -->
        <div class="transcript-area" id="transcript-area">
            <!-- Transcript lines appear here -->
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-connect" id="btn-connect" onclick="connect()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                Start Talking
            </button>

            <button class="btn btn-disconnect hidden" id="btn-disconnect" onclick="disconnect()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                End Session
            </button>

            <button class="btn btn-mute hidden" id="btn-mute" onclick="toggleMute()" title="Mute microphone">
                <svg id="mic-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                </svg>
            </button>
        </div>

        <!-- Footer -->
        <div class="footer">Runs 100% locally via Ollama • Audio processed by Deepgram</div>
    </div>

    <!-- LiveKit Client SDK (from CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
